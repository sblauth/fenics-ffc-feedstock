schema_version: 1

context:
  version: "2019.1.0"

package:
  name: fenics-ffc
  version: ${{ version }}

source:
  url: https://bitbucket.org/fenics-project/ffc/downloads/ffc-${{ version }}.tar.gz
  sha256: 4ff821a234869d8b9aaf8c5d7f617d42f9c134a2529e76c9519b681dff35affd
  patches:
    - ufc-include-path.patch
    - numpy-prod.patch
    - setuptools82.patch

build:
  number: 42
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv
    - mkdir -p $PREFIX/include
    - cp ffc/backends/ufc/*.h $PREFIX/include/

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - fenics-dijitso ==${{ version }}
    - fenics-fiat ==${{ version }}
    - fenics-ufl ==${{ version }}

tests:
  - python:
      imports:
        - ffc
        - ffc.backends
        - ffc.backends.dolfin
        - ffc.backends.ufc
        - ffc.errorcontrol
        - ffc.quadrature
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - ffc --help
      - test -f $PREFIX/include/ufc.h
      - test -f $PREFIX/include/ufc_geometry.h

about:
  license: LGPL-3.0-or-later
  license_file:
    - COPYING
    - COPYING.LESSER
  summary: The FEniCS Form Compiler
  description: |
    FEniCS is a collection of free software for automated, efficient solution of differential equations
    (https://fenicsproject.org). It provides C++ and Python interfaces, and creates effecient solvers via
    expression of finite variational statements in a domain-specific language that are transformed and
    just-in-time compiled into efficient implementations.
  homepage: https://www.fenicsproject.org
  repository: https://bitbucket.org/fenics-project/
  documentation: https://fenics.readthedocs.io

extra:
  recipe-maintainers:
    - garth-wells
    - johannesring
    - mikaem
    - minrk
    - jan-janssen
    - sblauth
